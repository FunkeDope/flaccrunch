<!doctype html>
<html lang="en" data-theme="basic-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FlacCrunch</title>
    <script>
      // Apply the saved display theme before first paint so there is no flash
      // of the default theme. Keep the id list in sync with src/themes/index.ts.
      (function () {
        var ids = ["win95", "basic", "basic-dark", "basic-wizard", "winamp", "matrix", "flash", "arcade", "casino", "comic", "dos", "gameboy", "limewire"];
        var theme = "basic-dark";
        try {
          var stored = window.localStorage.getItem("flaccrunch.theme");
          if (stored && ids.indexOf(stored) !== -1) theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
