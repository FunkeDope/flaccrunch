[package]
name = "flaccrunch"
version = "1.3.0"
description = "Lossless FLAC recompression with album art optimization"
authors = ["FlacCrunch Contributors"]
edition = "2021"
# Two [[bin]] targets: tell cargo (and the Tauri CLI) which one is the app.
default-run = "flaccrunch"

[lib]
name = "flaccrunch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# GUI binary (Tauri). Also accepts `-silent` for the legacy in-binary CLI mode.
[[bin]]
name = "flaccrunch"
path = "src/main.rs"
required-features = ["gui"]

# Headless CLI. Build with `cargo build --release --no-default-features --bin flaccrunch-cli`
# to get a binary with no Tauri / WebKit / GTK dependencies at all.
[[bin]]
name = "flaccrunch-cli"
path = "src/bin/flaccrunch-cli.rs"

[features]
default = ["gui"]
# Everything that needs Tauri: the desktop/mobile GUI, IPC commands, dialogs,
# Android content-URI bridge. The processing core never depends on this.
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:url",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
url = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tokio-util = "0.7"
md-5 = "0.10"
sha2 = "0.10"
# `binary` (clap/env_logger) and `zopfli` are not needed: preset 4 never uses zopfli.
oxipng = { version = "9", default-features = false, features = ["parallel"] }
# Lossless JPEG Huffman re-optimization at the DCT-coefficient level (what
# `jpegtran -optimize` does). No nasm: SIMD is irrelevant for cover art.
mozjpeg-sys = { version = "2.2", default-features = false, features = ["unwinding", "parallel"] }
# Decoders only: used to verify optimized artwork decodes to identical pixels.
zune-jpeg = "0.4"
png = "0.17"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
libc = "0.2"
libflac-sys = { version = "0.3", default-features = false, features = ["build-flac"] }

[dev-dependencies]
tempfile = "3"
# Produces deliberately non-optimized JPEGs for the transcoder tests.
jpeg-encoder = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dev/test builds: keep our own code unoptimized for fast rebuilds and good
# backtraces, but optimize dependencies. libFLAC (built by cmake) and oxipng
# are 10-50x slower at opt-level 0, which made the fixture-based tests crawl.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.libflac-sys]
opt-level = 3
