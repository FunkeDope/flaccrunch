name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  # The processing core + headless CLI. No GTK/WebKit needed: this is what the
  # Linux CLI artifact is built from.
  check-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v3-rust-core-${{ matrix.os }}

      - name: Clippy (core)
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Test (core)
        working-directory: src-tauri
        run: cargo test --no-default-features

      - name: Build CLI
        working-directory: src-tauri
        run: cargo build --release --no-default-features --bin flaccrunch-cli

      - name: Smoke-test CLI
        working-directory: src-tauri
        shell: bash
        run: |
          BIN=target/release/flaccrunch-cli
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          mkdir -p /tmp/smoke && cp ../Tests/un-optimized.flac /tmp/smoke/track.flac
          "$BIN" --dry-run /tmp/smoke
          "$BIN" --threads 2 --mark --log /tmp/smoke/run.log /tmp/smoke
          "$BIN" --skip-crunched /tmp/smoke
          cat /tmp/smoke/run.log | head -20

  check-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v3-rust-gui

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Clippy (GUI)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (GUI feature set)
        working-directory: src-tauri
        run: cargo test

      - name: Check build
        working-directory: src-tauri
        run: cargo build
