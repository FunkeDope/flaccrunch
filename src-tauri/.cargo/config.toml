# CPU baseline for the Rust side.
#
# This used to be `target-cpu=native`. That is fine for a one-off local build,
# but binaries built in CI are cached between runners with different CPUs and
# published to users, and `native` made them crash with SIGILL (illegal
# instruction) whenever the consuming machine lacked an instruction set the
# building machine had. x86-64-v3 (AVX2/FMA/BMI, every x86 CPU since ~2013)
# is the portable choice and matches the /arch:AVX2 already required of
# libFLAC below. Apple Silicon needs no override: its default target is M1+.
#
# For a personal max-performance build: `RUSTFLAGS="-C target-cpu=native" cargo build --release`.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[env]
# CFLAGS is picked up by the `cc` crate (used by libflac-sys's build script)
# to compile the libFLAC C sources with SIMD optimizations.
# MSVC: /arch:AVX2 = enable AVX2 SIMD instructions. (/O2 is intentionally NOT
# here: the `cmake` crate strips every /O flag; see the toolchain file below.)
CFLAGS_x86_64-pc-windows-msvc = "/arch:AVX2"
# The `cmake` crate overrides CMake's per-configuration MSVC flags with ones
# that carry no optimization switch, which left libFLAC compiled at /Od for
# the dev/test profile (fixture tests ran ~5x slower). This toolchain file
# forces /O2 back on for every configuration.
CMAKE_TOOLCHAIN_FILE_x86_64-pc-windows-msvc = { value = "cmake/msvc-flags.cmake", relative = true }
